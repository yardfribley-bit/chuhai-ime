# AgentReins 官网独立虚拟主机；证书签发后由 Certbot 添加 HTTPS。
server {
    listen 80;
    listen [::]:80;
    server_name www.cyberstroll.top;
    root /var/www/chuhai-ime/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location / { try_files $uri $uri/ =404; }
    location ^~ /downloads/ {
        alias /var/www/chuhai-ime/downloads/;
        autoindex off;
        types { application/octet-stream exe pkg; application/vnd.android.package-archive apk; text/plain txt; }
        default_type application/octet-stream;
        add_header Content-Disposition attachment;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { deny all; }
}
